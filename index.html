<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团建地点参考</title>
<link rel="stylesheet" href="leaflet/leaflet.min.css">
<style>
  :root{
    --paper:#f7f3ec;
    --paper-2:#efe8dc;
    --ink:#23201c;
    --muted:#7b7266;
    --line:#ded4c4;
    --accent:#c0502b;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.7;}
  img{display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 34px;}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(247,243,236,.92);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .topbar .in{max-width:1180px;margin:0 auto;padding:14px 34px;display:flex;align-items:center;gap:28px;}
  .topbar .brand{font-family:var(--serif);font-size:16px;letter-spacing:.04em;white-space:nowrap;}
  .topbar nav{display:flex;gap:22px;margin-left:auto;font-size:13px;}
  .topbar nav a{color:var(--muted);text-decoration:none;transition:color .25s;}
  .topbar nav a:hover{color:var(--accent);}
  .topbar .print{border:1px solid var(--line);background:transparent;color:var(--ink);
    font-size:12.5px;padding:7px 13px;border-radius:99px;cursor:pointer;font-family:inherit;
    transition:.25s;}
  .topbar .print:hover{border-color:var(--accent);color:var(--accent);}

  .hero{position:relative;height:calc(100svh - 57px);min-height:520px;overflow:hidden;
    background:#2a241d;}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scale(1.06);animation:heroIn 14s ease-out forwards;}
  @keyframes heroIn{to{transform:scale(1);}}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(24,19,14,.5) 0%,rgba(24,19,14,.08) 42%,rgba(24,19,14,.78) 100%);}
  .hero .inner{position:relative;z-index:2;height:100%;max-width:1180px;margin:0 auto;
    padding:0 34px 78px;display:flex;flex-direction:column;justify-content:flex-end;color:#fdf9f2;}
  .hero .eyebrow{font-size:12px;letter-spacing:.26em;opacity:.86;margin-bottom:20px;}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,6vw,76px);
    line-height:1.16;margin:0 0 18px;letter-spacing:.01em;}
  .hero p{margin:0;font-size:14.5px;color:rgba(253,249,242,.82);letter-spacing:.02em;}
  .hero .go{margin-top:30px;}
  .hero .go a{display:inline-block;background:#fdf9f2;color:#23201c;text-decoration:none;
    font-size:14px;padding:12px 26px;border-radius:99px;transition:.3s;}
  .hero .go a:hover{background:var(--accent);color:#fff;}

  .mapsec{padding:60px 0 0;}
  .mapbox{height:480px;border:1px solid var(--line);border-radius:3px;background:var(--paper-2);}
  .mapnote{margin:12px 0 0;font-size:12.5px;color:var(--muted);}
  .mk{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);}
  .mk.school{width:auto;padding:0 12px;border-radius:99px;background:#23201c;font-size:12px;}
  .amap{color:var(--accent);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(192,80,43,.4);}
  .amap:hover{border-bottom-color:var(--accent);}

  .place{padding:72px 0 0;scroll-margin-top:70px;}
  .place + .place{padding-top:88px;}
  .shot{position:relative;overflow:hidden;background:var(--paper-2);cursor:zoom-in;}
  .shot img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1);}
  .shot:hover img{transform:scale(1.035);}
  .shot.main{aspect-ratio:16/9;border-radius:3px;}
  .shot .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 36px 30px;color:#fdf9f2;
    background:linear-gradient(0deg,rgba(18,15,12,.74) 0%,rgba(18,15,12,.18) 62%,rgba(18,15,12,0) 100%);
    pointer-events:none;}
  .shot .cap .no{font-size:11.5px;letter-spacing:.28em;color:rgba(253,249,242,.72);}
  .shot .cap h2{font-family:var(--serif);font-weight:600;margin:10px 0 6px;
    font-size:clamp(26px,3.6vw,44px);line-height:1.2;}
  .shot .cap .loc{font-size:13px;color:rgba(253,249,242,.8);letter-spacing:.02em;}

  .lede{margin:24px 0 0;max-width:760px;font-size:16px;color:#3f3a33;}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:14px;margin-top:16px;}
  .strip figure{margin:0;cursor:zoom-in;}
  .strip img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;
    transition:transform .9s cubic-bezier(.2,.7,.2,1);}
  .strip figure:hover img{transform:scale(1.03);}
  .strip figcaption{font-size:12.5px;color:var(--muted);margin-top:9px;letter-spacing:.02em;}

  .spots{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);}
  .spots h4{margin:0 0 4px;font-size:11.5px;letter-spacing:.2em;color:var(--accent);font-weight:700;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .spots h4 .hint{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:400;}
  .spot{display:flex;align-items:center;gap:14px;padding:10px 0;}
  .spot + .spot{border-top:1px dashed var(--line);}
  .spot .th{width:56px;height:56px;object-fit:cover;border-radius:3px;flex:none;background:var(--paper-2);cursor:zoom-in;}
  .spot .sn{min-width:0;}
  .spot .nm{font-size:14.5px;font-weight:600;line-height:1.4;}
  .spot .nt{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.5;}
  .spot .tg{margin-left:auto;flex:none;font-size:11px;letter-spacing:.05em;padding:3px 10px;
    border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
  .spot .tg.hot{border-color:rgba(192,80,43,.4);color:var(--accent);background:rgba(192,80,43,.06);}
  .spot .sl{margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;}
  .spot .sl a{font-size:12px;color:var(--accent);text-decoration:none;
    border-bottom:1px solid rgba(192,80,43,.35);transition:border-color .25s;}
  .spot .sl a:hover{border-bottom-color:var(--accent);}

  .meta{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;
    margin-top:30px;padding-top:24px;border-top:1px solid var(--line);}
  .meta h4{margin:0 0 9px;font-size:11.5px;letter-spacing:.2em;color:var(--accent);font-weight:700;}
  .meta p{margin:0;font-size:14px;color:#4a443c;line-height:1.8;}

  .place .shot.main,.place .strip,.place .spots,.place .meta,.place .lede{
    opacity:0;transform:translateY(20px);transition:opacity .85s ease,transform .85s cubic-bezier(.2,.7,.2,1);}
  .place.in .shot.main,.place.in .strip,.place.in .spots,.place.in .meta,.place.in .lede{opacity:1;transform:none;}
  .place.in .strip{transition-delay:.09s;}
  .place.in .spots{transition-delay:.13s;}
  .place.in .meta{transition-delay:.17s;}

  .filtersec{padding:36px 0 0;}
  .fbar{display:flex;align-items:stretch;gap:36px;border:1px solid var(--line);
    border-radius:4px;background:#fdfbf7;padding:20px 30px;}
  .fsliders{display:flex;gap:24px;flex:none;}
  .fvctl{display:flex;flex-direction:column;align-items:center;gap:10px;width:92px;}
  .fvctl .fv-t{font-size:12.5px;letter-spacing:.14em;color:var(--muted);}
  .fvctl input[type=range]{writing-mode:vertical-lr;direction:rtl;width:26px;height:150px;
    accent-color:var(--accent);margin:0;cursor:pointer;padding:0;}
  .fvctl input[type=range]:focus-visible{outline:2px solid rgba(192,80,43,.4);outline-offset:3px;border-radius:6px;}
  .fvctl .fv-val{font-size:14px;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;white-space:nowrap;min-width:88px;text-align:center;}
  .fside{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;
    border-left:1px dashed var(--line);padding-left:34px;}
  .fbar-foot{margin-top:auto;display:flex;align-items:baseline;gap:16px;}
  .fst{font-size:13px;color:var(--muted);flex:1;min-width:0;}
  .fst b{color:var(--accent);}
  .freset{border:1px solid var(--line);background:transparent;color:var(--muted);
    font-family:inherit;font-size:12px;padding:4px 15px;border-radius:99px;cursor:pointer;
    transition:all .2s;flex:none;}
  .freset:hover{border-color:var(--accent);color:var(--accent);}
  .fseg .segbtns{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);
    border-radius:99px;padding:3px;background:var(--paper);}
  .fseg .segbtns::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);
    background:var(--accent);border-radius:99px;transition:transform .28s cubic-bezier(.2,.7,.2,1);}
  .fseg .segbtns[data-v="8"]::before{transform:translateX(100%);}
  .fseg .segb{position:relative;z-index:1;background:none;border:0;font-family:inherit;font-size:12.5px;
    padding:6px 14px;border-radius:99px;cursor:pointer;color:var(--muted);transition:color .28s;}
  .fseg .segb.on{color:#fdf9f2;}
  .ftags{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .ftags .tl{font-size:12.5px;color:var(--muted);margin-right:6px;}
  .tagb{border:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;
    font-size:12px;padding:5px 14px;border-radius:99px;cursor:pointer;transition:all .2s;}
  .tagb:hover{border-color:var(--accent);color:var(--accent);}
  .tagb.on{background:var(--accent);border-color:var(--accent);color:#fdf9f2;}
  .place{transition:opacity .45s ease,filter .45s ease;position:relative;}
  .place.dim{opacity:.16;filter:grayscale(1);}
  .place .ghost{position:absolute;top:-14px;right:22px;z-index:0;font-family:var(--serif);
    font-size:clamp(110px,14vw,190px);line-height:1;color:transparent;
    -webkit-text-stroke:1.5px rgba(192,80,43,.2);pointer-events:none;user-select:none;}
  .place .wrap{position:relative;z-index:1;}
  .place .rec{position:absolute;top:24px;right:24px;z-index:3;background:var(--accent);color:#fdf9f2;
    font-family:var(--serif);font-size:12px;letter-spacing:.32em;text-indent:.32em;
    padding:10px 7px;border-radius:2px;writing-mode:vertical-rl;box-shadow:0 6px 18px rgba(60,30,10,.3);}
  .sale{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin-top:16px;
    padding:11px 16px;border:1px dashed var(--line);border-radius:4px;}
  .sale .st{font-size:11.5px;letter-spacing:.2em;color:var(--accent);font-weight:700;}
  .sale a{font-size:13px;color:var(--accent);text-decoration:none;
    border-bottom:1px solid rgba(192,80,43,.35);transition:border-color .25s;}
  .sale a:hover{border-bottom-color:var(--accent);}
  .sale .sn2{font-size:11.5px;color:var(--muted);}

  footer{margin-top:96px;border-top:1px solid var(--line);padding:30px 0 54px;}
  footer p{margin:0;font-size:12.5px;color:var(--muted);}

  /* 大图查看 */
  .lb{position:fixed;inset:0;z-index:90;background:rgba(14,12,10,.95);
    display:none;padding:56px 20px 28px;}
  .lb.on{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .lb img{max-width:94vw;max-height:78vh;object-fit:contain;}
  .lb .lbcap{margin-top:18px;color:#f2eadf;font-size:13.5px;letter-spacing:.02em;text-align:center;}
  .lb button{position:absolute;border:none;background:rgba(255,255,255,.1);color:#fdf9f2;
    width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;transition:background .25s;}
  .lb button:hover{background:rgba(255,255,255,.24);}
  .lb .x{top:20px;right:22px;}
  .lb .prev{left:22px;top:50%;transform:translateY(-50%);}
  .lb .next{right:22px;top:50%;transform:translateY(-50%);}

  @media (max-width:820px){
    .wrap,.topbar .in,.hero .inner{padding-left:22px;padding-right:22px;}
    .topbar nav{display:none;}
    .topbar .in{gap:12px;}
    .topbar .print{margin-left:auto;}
    .hero{height:calc(100svh - 53px);min-height:440px;}
    .hero .inner{padding-bottom:54px;}
    .intro{padding-top:52px;}
    .mapsec{padding-top:40px;}
    .mapbox{height:340px;}
    .place,.place + .place{padding-top:56px;}
    .shot.main{aspect-ratio:4/3;}
    .shot .cap{padding:22px 20px 20px;}
    .meta{grid-template-columns:1fr;gap:20px;}
    .spot{gap:11px;}
    .spot .th{width:48px;height:48px;}
    .spot .tg{font-size:10.5px;padding:2px 8px;}
    .fbar{flex-direction:column;gap:20px;padding:16px 18px;}
    .fsliders{width:100%;justify-content:space-around;gap:12px;}
    .fvctl{width:46%;max-width:280px;}
    .fvctl input[type=range]{writing-mode:horizontal-tb;direction:ltr;width:100%;height:26px;}
    .fside{border-left:0;padding-left:0;border-top:1px dashed var(--line);padding-top:16px;}
    .place .ghost{display:none;}
    .place .rec{top:14px;right:12px;padding:8px 6px;font-size:11px;}
    .lb .prev{left:10px;} .lb .next{right:10px;}
  }
  @media print{
    .topbar,.hero .go,.lb,.mapsec{display:none !important;}
    .hero{height:auto;min-height:0;}
    .hero img{position:static;height:auto;animation:none;transform:none;}
    .hero::after{display:none;}
    .hero .inner{color:var(--ink);padding:34px 0 20px;position:static;height:auto;}
    .hero p{color:var(--muted);}
    body{background:#fff;}
    .place{break-inside:avoid;padding-top:34px;}
    .place.dim{opacity:1 !important;filter:none !important;}
    .place .ghost{display:none;}
    .filtersec{display:none !important;}
    .place .shot.main,.place .strip,.place .spots,.place .meta,.place .lede{opacity:1 !important;transform:none !important;}
    .strip{grid-template-columns:repeat(3,1fr);}
    .spot{break-inside:avoid;}
    .shot,.strip img{border-radius:0;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <div class="brand">团建地点参考</div>
    <nav>
      <a href="#a">韩家窝</a>
      <a href="#b">豹山乐园</a>
      <a href="#c">齐都印象</a>
      <a href="#d">泓基农业</a>
      <a href="#e">幽幽谷</a>
    </nav>
    <button class="print" onclick="window.print()">打印 / 存 PDF</button>
  </div>
</div>

<header class="hero">
  <img src="images/hero.jpg" alt="中郝峪幽幽谷山村航拍">
  <div class="inner">
    <div class="eyebrow">淄博周边 · 能吃能玩 · 一日往返</div>
    <h1>团建地点参考</h1>
    <p>韩家窝 · 豹山乐园 · 齐都印象 · 泓基农业 · 幽幽谷</p>
    <div class="go"><a href="#a">往下看</a></div>
  </div>
</header>

<section class="mapsec">
  <div class="wrap">
    <div class="mapbox" id="map"></div>
    <p class="mapnote">位置示意：深色圆点为学校，红色圆点为五个备选地点，点圆点可看车程；地图可拖动、缩放。</p>
  </div>
</section>

<section class="filtersec">
  <div class="wrap">
    <div class="fbar">
      <div class="fsliders">
        <div class="fvctl">
          <span class="fv-t">车程</span>
          <input type="range" id="fTime" min="15" max="120" step="15" value="120" aria-label="能接受的车程上限">
          <output class="fv-val" id="fTimeV">120 分钟+</output>
        </div>
        <div class="fvctl">
          <span class="fv-t">人均</span>
          <input type="range" id="fPrice" min="40" max="150" step="10" value="150" aria-label="能接受的人均花费上限">
          <output class="fv-val" id="fPriceV">150 元+</output>
        </div>
      </div>
      <div class="fside">
        <div class="fseg">
          <div class="segbtns" id="seg" data-v="8">
            <button class="segb" data-v="4" type="button">半天</button>
            <button class="segb on" data-v="8" type="button">一日</button>
          </div>
        </div>
        <div class="ftags" id="ftags"><span class="tl">想玩（满足任一即可）：</span></div>
        <div class="fbar-foot">
          <span class="fst" id="fStatus">拖动滑条、点亮标签，筛选地点。</span>
          <button class="freset" id="fReset" type="button">重置</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="list"></div>

<footer>
  <div class="wrap">
    <p>照片来自景区官方发布与公开报道，仅作选点参考；具体开放项目与现场情况以出行时为准。</p>
  </div>
</footer>

<div class="lb" id="lb">
  <button class="x" aria-label="关闭">×</button>
  <button class="prev" aria-label="上一张">‹</button>
  <img id="lbImg" alt="">
  <div class="lbcap" id="lbCap"></div>
  <button class="next" aria-label="下一张">›</button>
</div>

<script src="leaflet/leaflet.min.js"></script>
<script>
const PLACES = [
  {
    id:"a", no:"01", name:"韩家窝村", zh:"壹", rec:true,
    sale:{note:"村内不设统一门票；彩虹滑道、采摘、餐饮各点位单独收费。团体提前联系村旅游公司 13706436211"},
    loc:"周村区南郊镇韩家窝村　|　约 10 公里 · 车程约 20 分钟，离校区最近",
    cover:"images/hanjiawo_cover.jpg", coverCap:"彩虹滑道从山坡直铺到村里",
    lede:"墨香山下的乡村旅游村。200 亩墨水河景观、荷塘竹林、彩虹滑道、水上餐厅和蒙古包都在村里，吃饭和玩不用来回跑，路上也最省时间。",
    scenes:[
      {src:"images/hanjiawo_s1.jpg", cap:"荷塘与木栈道：村口的墨水河景观带"},
      {src:"images/hanjiawo_s2.jpg", cap:"水上餐厅：沿水的白墙房子，团餐可订"},
      {src:"images/hanjiawo_s3.jpg", cap:"花田：村边的花海，秋天颜色最好"}
    ],
    spots:[
      {n:"彩虹滑道", d:"从山坡铺下来的彩色滑道，单人单次往下滑，最热闹的一项", t:"单独收费", hot:true, img:"images/hanjiawo_t1.jpg"},
      {n:"水上餐厅 · 蒙古包", d:"沿水餐位和蒙古包，农家菜按桌提前订", t:"需预订", hot:true, img:"images/hanjiawo_t3.jpg"},
      {n:"荷塘 · 竹林憩园", d:"木栈道、凉亭和竹林，适合分组拍照、坐着歇脚", t:"免费", img:"images/hanjiawo_t2.jpg"},
      {n:"果蔬采摘大棚", d:"连片 9 个大棚，当季果蔬现摘", t:"按斤称重", img:"images/hanjiawo_t4.jpg"},
      {n:"鲁派民宿大院", d:"村里整修的民宿院落，可参观也可订住", t:"可预订"}
    ],
    notice:"滑道、餐厅、采摘是分开经营的，来之前先打电话把项目和餐一起定好；11 月花海谢了，主要玩滑道、采摘和吃饭。"
  },
  {
    id:"b", no:"02", name:"苏李豹山乐园", zh:"贰",
    sale:{note:"门票与项目收费以现场为准，水上乐园单独收费；园区由苏李村合作社运营"},
    loc:"周村区王村镇苏李村　|　约 27 公里 · 车程约 35 分钟",
    cover:"images/baoshan_cover.jpg", coverCap:"园区航拍：水上乐园、草坪和山坡滑道挤在山谷里",

/* 滚动出现 */
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
},{threshold:.14});
document.querySelectorAll(".place").forEach(el=>io.observe(el));

/* 筛选：车程/人均滑条 + 半天/一日切换 + 标签，同时作用于页面区块和地图圆点 */
const FILTER = {
  a:{t:20,p:80, h:8, tags:["彩虹滑道","农家菜","采摘"]},
  b:{t:35,p:70, h:8, tags:["水上乐园","动物互动","采摘"]},
  c:{t:30,p:110,h:8, tags:["轰趴别墅","烧烤"]},
  d:{t:25,p:50, h:4, tags:["采摘","农家菜","垂钓"]},
  e:{t:90,p:110,h:8, tags:["真人CS","拓展","农家菜"]}
};
const TAGS = ["轰趴别墅","烧烤","农家菜","采摘","彩虹滑道","水上乐园","动物互动","真人CS","拓展","垂钓"];
const placeMarkers = {};
const selTags = new Set();
let durV = 8;
const fTime = document.getElementById("fTime"),
      fPrice = document.getElementById("fPrice"),
      seg = document.getElementById("seg"),
      ftags = document.getElementById("ftags"),
      fTimeV = document.getElementById("fTimeV"),
      fPriceV = document.getElementById("fPriceV"),
      fStatus = document.getElementById("fStatus");

function applyFilter(){
  const tv = +fTime.value, pv = +fPrice.value;
  fTimeV.textContent = tv >= 120 ? "120 分钟+" : "≤ " + tv + " 分钟";
  fPriceV.textContent = pv >= 150 ? "150 元+" : "≤ " + pv + " 元";
  let m = 0;
  document.querySelectorAll(".place").forEach(el=>{
    const f = FILTER[el.id];
    const ok = f.t <= tv && f.p <= pv && f.h <= durV
      && (selTags.size===0 || [...selTags].some(t=>f.tags.includes(t)));
    el.classList.toggle("dim", !ok);
    const mk = placeMarkers[el.id];
    if(mk){
      mk.setOpacity(ok ? 1 : 0.18);
      const me = mk.getElement();
      if(me) me.style.filter = ok ? "" : "grayscale(1)";
    }
    if(ok) m++;
  });
  const idle = tv >= 120 && pv >= 150 && durV === 8 && selTags.size === 0;
  if(idle){
    fStatus.innerHTML = "拖动滑条、点亮标签，筛选地点。";
  }else if(m === 0){
    fStatus.innerHTML = "<b>没有地点同时满足</b>，放宽一点试试。";
  }else{
    fStatus.innerHTML = `<b>${m} / 5</b> 个地点符合，地图上不符合的已变灰。`;
  }
}
fTime.addEventListener("input", applyFilter);
fPrice.addEventListener("input", applyFilter);
seg.addEventListener("click", e=>{
  const b = e.target.closest(".segb");
  if(!b) return;
  seg.dataset.v = b.dataset.v;
  seg.querySelectorAll(".segb").forEach(x=>x.classList.toggle("on", x===b));
  durV = +b.dataset.v;
  applyFilter();
});
ftags.insertAdjacentHTML("beforeend",
  TAGS.map(t=>`<button class="tagb" data-t="${t}" type="button">${t}</button>`).join(""));
ftags.addEventListener("click", e=>{
  const b = e.target.closest(".tagb");
  if(!b) return;
  b.classList.toggle("on");
  if(b.classList.contains("on")) selTags.add(b.dataset.t); else selTags.delete(b.dataset.t);
  applyFilter();
});
document.getElementById("fReset").addEventListener("click", ()=>{
  fTime.value = 120; fPrice.value = 150;
  seg.dataset.v = "8";
  seg.querySelectorAll(".segb").forEach(x=>x.classList.toggle("on", x.dataset.v==="8"));
  durV = 8; selTags.clear();
  ftags.querySelectorAll(".tagb").forEach(b=>b.classList.remove("on"));
  applyFilter();
});
applyFilter();

/* 大图查看 */
const lb = document.getElementById("lb"),
      lbImg = document.getElementById("lbImg"),
      lbCap = document.getElementById("lbCap");
let cur = {g:null, imgs:[], idx:0};

function groupOf(id){
  const p = PLACES.find(x=>x.id===id);
  return [{src:p.cover, cap:p.name+" · "+p.coverCap}].concat(p.scenes.map(s=>({src:s.src, cap:s.cap})));
}
/* groupOf 保留供调试；灯箱实际从 DOM 收集，见 openLb */
function openLb(el){
  const g = el.dataset.g;
  const els = [...document.querySelectorAll(`[data-g="${g}"]`)];
  cur.g = g;
  cur.imgs = els.map(x=>{
    const img = x.tagName==="IMG" ? x : x.querySelector("img");
    const fc = x.closest("figure");
    const fig = fc ? fc.querySelector("figcaption") : null;
    const cap = x.dataset.cap || (fig ? fig.innerText : "") || x.alt || "";
    return {src: img.src, cap: cap};
  });
  cur.idx = Math.max(0, els.indexOf(el));
  render2();
  lb.classList.add("on"); document.body.style.overflow = "hidden";
}
function render2(){
  const it = cur.imgs[cur.idx];
  lbImg.src = it.src; lbImg.alt = it.cap; lbCap.textContent = it.cap;
}
function closeLb(){ lb.classList.remove("on"); document.body.style.overflow = ""; }
function step(d){ cur.idx = (cur.idx + d + cur.imgs.length) % cur.imgs.length; render2(); }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-g]");
  if(t && !lb.contains(e.target)){ openLb(t); return; }
  if(e.target.closest(".lb .x")) closeLb();
  else if(e.target.closest(".lb .prev")) step(-1);
  else if(e.target.closest(".lb .next")) step(1);
  else if(e.target === lb) closeLb();
});
document.addEventListener("keydown", e=>{
  if(!lb.classList.contains("on")) return;
  if(e.key === "Escape") closeLb();
  if(e.key === "ArrowLeft") step(-1);
  if(e.key === "ArrowRight") step(1);
});

/* 位置地图（高德底图，WGS84 转 GCJ02） */
if(window.L){
  function wgs2gcj(wgsLat, wgsLng){
    const a=6378245.0, ee=0.00669342162296594323;
    function tL(x,y){return -100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x))
      +(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3
      +(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3
      +(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;}
    function tB(x,y){return 300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x))
      +(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3
      +(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3
      +(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;}
    let dLat=tB(wgsLng-105,wgsLat-35), dLng=tL(wgsLng-105,wgsLat-35);
    const radLat=wgsLat/180*Math.PI; let magic=Math.sin(radLat);
    magic=1-ee*magic*magic; const sq=Math.sqrt(magic);
    dLat=(dLat*180)/((a*(1-ee))/(magic*sq)*Math.PI);
    dLng=(dLng*180)/(a/sq*Math.cos(radLat)*Math.PI);
    return [wgsLat+dLat, wgsLng+dLng];
  }
  const SCHOOL=[36.8454,117.92933];   /* 山东农业工程学院淄博校区 */
  const SPOTS=[
    {id:"a", lat:36.75408, lng:117.87348},
    {id:"b", lat:36.65718, lng:117.71481},
    {id:"c", lat:36.83134, lng:118.10470},
    {id:"d", lat:36.94819, lng:117.98782},
    {id:"e", lat:36.32290, lng:118.07467}
  ];
  const map=L.map("map",{scrollWheelZoom:false});
  L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",
    {subdomains:"1234", maxZoom:18, attribution:"© 高德地图"}).addTo(map);
  const bnds=[];
  const gS=wgs2gcj(SCHOOL[0],SCHOOL[1]);
  L.marker(gS,{icon:L.divIcon({className:"",html:'<div class="mk school">学校</div>',iconSize:[64,26],iconAnchor:[32,13]})})
    .addTo(map).bindPopup("<b>山东农业工程学院淄博校区</b><br>周村区鲁泰大道6666号");
  bnds.push(gS);
  SPOTS.forEach((s,i)=>{
    const p=PLACES.find(x=>x.id===s.id);
    const g=wgs2gcj(s.lat,s.lng); bnds.push(g);
    const km=(p.loc.match(/约 (\d+) 公里/)||[])[1];
    const dv=(p.loc.match(/车程约 (\d+) 分钟/)||[])[1];
    const mk=L.marker(g,{icon:L.divIcon({className:"",html:`<div class="mk">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})})
      .addTo(map).bindPopup(`<b>${p.name}</b><br>距学校约 ${km} 公里 · 车程约 ${dv} 分钟<br><a href="#${p.id}">查看这个地点 ↓</a>`);
    placeMarkers[s.id]=mk;
  });
  map.fitBounds(bnds,{padding:[46,46],maxZoom:11});
  applyFilter();
  /* 各地点“在高德地图中打开”链接 */
  document.querySelectorAll("[data-amap]").forEach(el=>{
    const s=SPOTS.find(x=>x.id===el.dataset.amap);
    const p=PLACES.find(x=>x.id===s.id);
    const g=wgs2gcj(s.lat,s.lng);
    el.href=`https://uri.amap.com/marker?position=${g[1].toFixed(5)},${g[0].toFixed(5)}&name=${encodeURIComponent(p.name)}`;
  });
}
